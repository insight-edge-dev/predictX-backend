name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "🚀 Deploying PredictX Backend..."

            cd /var/www/predictx/backend/predictX-backend

            git fetch origin
            git reset --hard origin/main

            npm ci || npm install

            pm2 restart predictx-api --update-env

            # Stop PM2 worker first, then force-kill any rogues with SIGKILL
            # (SIGTERM in a loop can propagate to the SSH session — SIGKILL cannot)
            pm2 stop predictx-worker 2>/dev/null || true
            pkill -9 -f "[n]ode.*worker\.js" 2>/dev/null || true
            sleep 2

            # Restart worker under PM2 (picks up new code)
            pm2 restart predictx-worker --update-env 2>/dev/null \
              || pm2 start worker.js --name predictx-worker

            pm2 save --force

            echo "⏳ Waiting for API to be ready..."

            for i in 1 2 3 4 5; do
              sleep 6

              if curl -fsS https://api.predictxsports.com/health > /dev/null; then
                echo "✅ Backend deployed successfully"
                exit 0
              fi

              echo "  Attempt $i/5 failed — retrying..."
            done

            echo "❌ Backend health check failed after 30s"
            exit 1
